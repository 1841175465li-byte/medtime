<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>药记 · 用药时间记录</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="management.css">
  <link rel="stylesheet" href="accessibility.css">
  <script src="store.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="reminders.js" defer></script>
  <script src="time-picker.js" defer></script>
  <script src="preferences.js" defer></script>
  <script src="backup.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#today" aria-label="药记首页"><span data-icon="pill"></span><span>药记</span></a>
      <button class="icon-button settings-button" id="settings-button" aria-label="设置"><span data-icon="settings"></span></button>
    </header>
    <div id="storage-alert" role="alert" hidden></div>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-tab="today" aria-current="page"><span data-icon="calendar"></span><span>今天</span></button>
      <button class="nav-item" data-tab="history"><span data-icon="clock"></span><span>记录</span></button>
      <button class="nav-item" data-tab="medicines"><span data-icon="pill"></span><span>药品</span></button>
    </nav>
  </div>
  <div id="dialog-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="import-input" type="file" accept=".json,application/json" hidden>
  <noscript>药记需要启用 JavaScript 才能保存和查看记录。</noscript>
</body>
</html>
